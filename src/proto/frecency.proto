syntax = "proto3";

// Minimal slice of Discord's FrecencyUserSettings.
// Endpoint: GET /users/@me/settings-proto/2  (returns base64 protobuf)
// Field numbers per discord-protos: FrecencyUserSettings.
//   field 3 = favorite_stickers, field 4 = sticker_frecency.
// Unknown fields are ignored by protobufjs, so we don't model the rest.

message FavoriteStickers {
  repeated fixed64 sticker_ids = 1;
}

// value we don't care about; we only want the map keys (= sticker IDs used)
message StickerFrecencyItem {}

message StickerFrecency {
  map<fixed64, StickerFrecencyItem> stickers = 1;
}

// favorite GIFs (field 2). format: 1=IMAGE (gif/webp), 2=VIDEO (mp4)
message FavoriteGIF {
  int32 format = 1;
  string src = 2;
  int32 width = 3;
  int32 height = 4;
  int32 order = 5;
}

message FavoriteGIFs {
  map<string, FavoriteGIF> gifs = 1;
  bool hide_tooltip = 2;
}

message FrecencyUserSettings {
  FavoriteGIFs favorite_gifs = 2;
  FavoriteStickers favorite_stickers = 3;
  StickerFrecency sticker_frecency = 4;
}
